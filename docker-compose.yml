
services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - api

  api:
    build: ./services/api
    ports:
      - "4000:4000"
    volumes:
      - ./services/api:/app
      - /app/node_modules
    environment:
      PORT: "4000"
      FRONTEND_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://devsage:devsage_local_change_me@postgres:5432/devsage?schema=public"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev

  ai:
    build: ./services/ai
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devsage
      POSTGRES_USER: devsage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsage -d devsage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
